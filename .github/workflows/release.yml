name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags so the Go toolchain stamps the module version. The assertion below depends on it.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - name: assert the binary reports the tag
        run: |
          go build -o "$RUNNER_TEMP/otata" .
          got=$("$RUNNER_TEMP/otata" version)
          test "$got" = "otata $GITHUB_REF_NAME"

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      # Runs after publish, so failing doesn't retract the release.
      - name: assert released binaries are stamped with the tag
        run: |
          bins=$(find dist -type f -name otata)
          test -n "$bins"
          for bin in $bins; do
            ver=$(go version -m "$bin" | awk '$1 == "mod" { print $3 }')
            test "$ver" = "$GITHUB_REF_NAME"
          done

  # This runs after publish, so failing won't retract the release.
  # spctl needs macOS and asks Apple for the notarization ticket, which is the Gatekeeper verdict the cask relies on, so a skipped or broken signing step will show here
  gatekeeper:
    needs: release
    runs-on: macos-latest
    steps:
      - name: assert released macOS binaries are notarized
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*_darwin_*.tar.gz' --dir "$RUNNER_TEMP/assets"
          for tgz in "$RUNNER_TEMP"/assets/*.tar.gz; do
            dir="${tgz%.tar.gz}"
            mkdir -p "$dir"
            tar -xzf "$tgz" -C "$dir"
            codesign --verify --strict --verbose=2 "$dir/otata"
            verdict=$(spctl -a -vv -t install "$dir/otata" 2>&1)
            echo "$verdict"
            grep -q 'source=Notarized Developer ID' <<< "$verdict"
          done
