{{define "installscript"}}
<script id="latch">
/*
A second tap restarts an install iOS is already downloading, and the page
can't see the install itself. So the link dims and ignores taps for 10 seconds.
*/
document.addEventListener('click', function (e) {
  var link = e.target.closest && e.target.closest('a.install');
  if (!link || link.dataset.tapped) return;
  link.dataset.tapped = '1';
  link.classList.add('waiting');
  setTimeout(function () {
    delete link.dataset.tapped;
    link.classList.remove('waiting');
  }, 10000);
});
</script>
{{end}}
