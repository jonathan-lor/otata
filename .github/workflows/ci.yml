name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The tool runs on macOS and Linux, and each has paths the other skips:
    # launchd, the keychain and plists on one, the systemd user manager on
    # the other. Each also vets the other's build, so a change behind a
    # build tag cannot break the platform it was not made on.
    strategy:
      matrix:
        include:
          - os: macos-latest
            other: linux
          - os: ubuntu-latest
            other: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=${{ matrix.other }} go vet ./...
      - run: go test ./...
