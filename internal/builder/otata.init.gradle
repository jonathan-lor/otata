// Prints one tab-separated line per application module and per variant for
// otata's Gradle builder. It runs through --init-script, so the project is
// never modified.
allprojects {
    plugins.withId("com.android.application") {
        def p = project
        // After evaluation, in case the build script moves the build directory.
        p.afterEvaluate {
            println("otata-module\t" + p.path + "\t" + p.layout.buildDirectory.get().asFile)
        }
        p.androidComponents.onVariants(p.androidComponents.selector().all()) { v ->
            // Whether the variant is signed. hasConfig isn't public API, so
            // without it the APK is verified after the build instead.
            def signed = ""
            try {
                signed = v.signingConfig.hasConfig() ? "signed" : "unsigned"
            } catch (Throwable ignored) {
            }
            println("otata-variant\t" + p.path + "\t" + v.name + "\t" + (v.flavorName ?: "") + "\t" + (v.buildType ?: "") + "\t" + signed)
        }
    }
}
