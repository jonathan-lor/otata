name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Each OS has code the other can't run, so test on both and vet for the other.
    strategy:
      matrix:
        include:
          - os: macos-latest
            other: linux
          - os: ubuntu-latest
            other: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=${{ matrix.other }} go vet ./...
      - run: go test -race ./...
