{{define "agescript"}}
<script id="ages">
/*
Turns each <time>'s timestamp into an age, live, since the page outlives the
moment it was written. Keep the wording in step with render.Age.
*/
(function () {
  function age(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    if (s < 10) return 'just now';
    if (s < 60) return s + ' seconds ago';
    var m = Math.floor(s / 60);
    if (m < 2) return 'a minute ago';
    if (m < 60) return m + ' minutes ago';
    var h = Math.floor(m / 60);
    if (h < 2) return 'an hour ago';
    if (h < 24) return h + ' hours ago';
    var d = Math.floor(h / 24);
    if (d < 2) return 'yesterday';
    return d + ' days ago';
  }
  function elapsed(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + 's';
    return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  }
  function tick() {
    var now = Date.now();
    var els = document.querySelectorAll('time[data-age], time[data-since]');
    for (var i = 0; i < els.length; i++) {
      var t = Date.parse(els[i].getAttribute('datetime'));
      if (isNaN(t)) continue;
      els[i].textContent = els[i].hasAttribute('data-age') ? age(now - t) : 'for ' + elapsed(now - t);
    }
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
{{end}}
