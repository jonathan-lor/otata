{{/* A build's time, with a datetime for the age script when it's known. */}}
{{define "built"}}{{if .ISO}}<time datetime="{{.ISO}}" data-age>{{.Text}}</time>{{else}}{{.Text}}{{end}}{{end}}
{{define "since"}}{{if .ISO}}<time datetime="{{.ISO}}" data-since>since {{.Text}}</time>{{else}}for a while{{end}}{{end}}
