{{define "agescript"}}
<script id="ages">
/*
Ages are computed here, on the client, from the timestamp each <time> already
carries, and is never fetched or rendered at publish. The page is a file that
outlives the moment it was written, so an age written into it is wrong by
however long ago that was. The timestamp is right forever. If this script
doesn't run, the absolute time stands, which is technically true but less convenient.

Wording mirrors render.Age in Go, which the CLI uses. They need to be kept in step.
*/
(function () {
  function age(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    if (s < 10) return 'just now';
    if (s < 60) return s + ' seconds ago';
    var m = Math.floor(s / 60);
    if (m < 2) return 'a minute ago';
    if (m < 60) return m + ' minutes ago';
    var h = Math.floor(m / 60);
    if (h < 2) return 'an hour ago';
    if (h < 24) return h + ' hours ago';
    var d = Math.floor(h / 24);
    if (d < 2) return 'yesterday';
    return d + ' days ago';
  }
  function elapsed(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + 's';
    return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  }
  function tick() {
    var now = Date.now();
    var els = document.querySelectorAll('time[data-age], time[data-since]');
    for (var i = 0; i < els.length; i++) {
      var t = Date.parse(els[i].getAttribute('datetime'));
      if (isNaN(t)) continue;
      els[i].textContent = els[i].hasAttribute('data-age') ? age(now - t) : 'for ' + elapsed(now - t);
    }
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
{{end}}
