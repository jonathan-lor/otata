# Builds tar.gz archives for macOS and Linux. The macOS ones are also signed,
# notarized and published as a cask in jonathan-lor/homebrew-tap.
# Check with `goreleaser check`. Dry-run with `goreleaser release --snapshot
# --clean`, which skips signing without the MACOS_* variables.
version: 2

project_name: otata

# One build per platform, so the cask can take the macOS archives alone,
# since its uninstall and zap stanzas are launchd's.
builds:
  - id: darwin
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    flags:
      - -trimpath
    # The version comes from the VCS stamp, so no -X flags. Keep -buildvcs on,
    # or released binaries report "dev".
    ldflags:
      - -s -w
  - id: linux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: darwin
    ids: [darwin]
  - id: linux
    ids: [linux]

notarize:
  macos:
    # ids defaults to the project name, which matches no build here.
    - ids: [darwin]
      enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

changelog:
  use: github-native

release:
  github:
    owner: jonathan-lor
    name: otata

homebrew_casks:
  - ids: [darwin]
    repository:
      owner: jonathan-lor
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/jonathan-lor/otata
    description: Over-the-air installer for iOS and Android builds on your own network
    skip_upload: auto
    # brew upgrade runs these, stopping the agent until next login or `otata start`.
    uninstall:
      launchctl:
        - com.anakepha.otata
    zap:
      trash:
        - "~/Library/LaunchAgents/com.anakepha.otata.plist"
        - "~/.otata"
